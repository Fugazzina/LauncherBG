name: Genera Sfondi Ogni Giorno
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa librerie
        run: pip install requests Pillow python-dotenv

      - name: Pulisci cartella
        run: echo "Pulizia demandata allo script dopo aver letto i consigli"

      - name: Esegui script
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python crea_cards.py

      - name: Salva immagini nel repository
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add sfondi_projectivity/ recommendations.json || true
          git commit -m "Sfondi aggiornati $(date +%Y-%m-%d)" || echo "Nessuna modifica"
          git push || echo "Nessuna modifica da pushare"
